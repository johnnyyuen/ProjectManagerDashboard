<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technical Project Manager Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="header-panel">
    
    <div class="header-top-row">
      <div class="header-title-block">
        <h2>Technical Project Manager Dashboard</h2>
        <p>Upload a project register CSV / JSON file or download the sample template.</p>
      </div>

      <div class="controls-group">
        <div class="select-wrapper">
          <label for="themeSelect">Theme:</label>
          <select id="themeSelect" class="custom-select">
            <option value="dark" selected>Night Indigo</option>
            <option value="light">Classic Light</option>
          </select>
        </div>

        <div class="select-wrapper">
          <label for="displayModeSelect">View:</label>
          <select id="displayModeSelect" class="custom-select">
            <option value="super-compact" selected>Super Compact</option>
            <option value="compact">Compact</option>
            <option value="full">Full Info</option>
          </select>
        </div>

        <div class="select-wrapper">
          <label for="colorModeSelect">Colour By:</label>
          <select id="colorModeSelect" class="custom-select">
            <option value="both" selected>Status to PM</option>
            <option value="pm">Project Manager</option>
            <option value="rag">Status</option>
          </select>
        </div>

        <div class="btn-group">
          <button class="btn" id="zoomOutBtn" disabled title="Zoom Out">−</button>
          <span class="btn zoom-level-label" id="zoomLevelText">100%</span>
          <button class="btn" id="zoomInBtn" disabled title="Zoom In">+</button>
          <button class="btn" id="zoomResetBtn" disabled title="Reset Zoom">Fit</button>
        </div>

        <a href="https://johnnyyuen.github.io/ProjectManagerDashboard/ProjectListing.json" download="ProjectListing.json" target="_blank" class="file-download-btn" title="Download sample JSON dataset">
          📥 <span>Sample JSON</span>
        </a>

        <label class="file-upload-btn" for="fileInput">
          📁 <span id="uploadBtnText">Upload CSV / JSON</span>
        </label>
        <input type="file" id="fileInput" class="file-input-hidden" accept=".csv,.json,text/csv,application/json" />
      </div>
    </div>

    <div class="header-filter-row">
      <span class="filter-row-label">Filters:</span>

      <div class="dropdown-container" id="pmDropdownContainer" style="display: none;">
        <button class="dropdown-trigger" id="pmDropdownBtn">
          <span id="pmDropdownLabel">Filter PMs (All)</span> ▾
        </button>
        <div class="dropdown-menu" id="pmDropdownMenu">
          <div class="dropdown-actions">
            <button class="dropdown-action-btn" id="selectAllPmsBtn">Select All</button>
            <button class="dropdown-action-btn" id="deselectAllPmsBtn">Deselect All</button>
          </div>
          <div id="pmCheckboxList"></div>
        </div>
      </div>

      <div class="dropdown-container" id="sizeDropdownContainer" style="display: none;">
        <button class="dropdown-trigger" id="sizeDropdownBtn">
          <span id="sizeDropdownLabel">Size (All)</span> ▾
        </button>
        <div class="dropdown-menu" id="sizeDropdownMenu">
          <div class="dropdown-actions">
            <button class="dropdown-action-btn" id="selectAllSizesBtn">Select All</button>
            <button class="dropdown-action-btn" id="deselectAllSizesBtn">Deselect All</button>
          </div>
          <div id="sizeCheckboxList"></div>
        </div>
      </div>

      <div class="dropdown-container" id="ragDropdownContainer" style="display: none;">
        <button class="dropdown-trigger" id="ragDropdownBtn">
          <span id="ragDropdownLabel">Status (All)</span> ▾
        </button>
        <div class="dropdown-menu" id="ragDropdownMenu">
          <div class="dropdown-actions">
            <button class="dropdown-action-btn" id="selectAllRagsBtn">Select All</button>
            <button class="dropdown-action-btn" id="deselectAllRagsBtn">Deselect All</button>
          </div>
          <div id="ragCheckboxList"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="timeline-wrapper view-super-compact" id="chartViewport">
    <div class="chart-canvas" id="chartCanvas">
      
      <div class="header-row">
        <div class="sidebar-header-cell" id="sidebarHeaderCell">
          <span>Project Manager</span>
          <div id="overallPmTooltipContainer"></div>
        </div>
        <div class="calendar-axis" id="calendarAxis">
          <div class="quarters-row" id="quartersRow"></div>
          <div class="months-row" id="monthsRow"></div>
        </div>
      </div>

      <div id="unifiedRowsLayer">
        <div class="empty-state">
          No projects loaded. Upload a CSV or JSON file to generate the schedule, or 
          <a href="https://johnnyyuen.github.io/ProjectManagerDashboard/ProjectListing.json" download="ProjectListing.json" target="_blank">download the sample JSON dataset</a>.
        </div>
      </div>

    </div>
  </div>

  <script type="text/csv" id="embeddedCsvData"></script>

  <script src="./app.js"></script>
</body>
</html>
